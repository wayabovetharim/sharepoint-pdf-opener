<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SP PDF Opener</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="header-title">
        <svg class="header-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <h1>SP PDF Opener</h1>
      </div>
      <!-- Toggle Switch -->
      <label class="switch" title="Toggle extension state">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="slider"></span>
      </label>
    </header>

    <!-- Status Banner -->
    <section class="status-section">
      <div class="status-indicator">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-text" id="status-text">Active</span>
      </div>
    </section>

    <!-- Stats Card -->
    <section class="stats-section">
      <div class="stats-card">
        <span class="stats-label">PDFs opened</span>
        <span class="stats-count" id="pdf-count">0</span>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <a href="#" id="open-downloads" class="footer-link">Open downloads folder</a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
